# Robolectric 4.11.1 (a versão usada neste projeto, ver app/build.gradle.kts) só empacota SDKs de
# emulação até a 34 — mas `targetSdk` do app é 36. Sem fixar aqui, o Robolectric falha ao montar o
# runner com "Package targetSdkVersion=36 > maxSdkVersion=34" assim que os recursos reais do app
# ficam disponíveis para os testes (`testOptions.unitTests.isIncludeAndroidResources = true`).
# Ajustar quando o Robolectric usado for atualizado para uma versão com suporte a SDKs mais novos.
sdk=34
