name: iOS (Kotlin Multiplatform)

# Compila o código iOS do módulo :shared (iosMain + commonMain) e roda os testes de commonTest no
# simulador iOS. Os targets iOS só compilam em macOS, por isso este job existe separado do
# "Android CI" (ubuntu), onde esses targets são simplesmente ignorados.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  shared-ios:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Cache Kotlin/Native toolchain
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Test shared module on iOS simulator
      run: ./gradlew :shared:iosSimulatorArm64Test :shared:linkDebugFrameworkIosArm64
