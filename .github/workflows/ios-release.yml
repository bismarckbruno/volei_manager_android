name: iOS Release (TestFlight)

# Manual workflow: archives the app, signs it and uploads it to TestFlight.
# Requires an Apple Developer account and these repository secrets:
#   IOS_CERT_P12_BASE64        Apple Distribution certificate (.p12) in base64
#   IOS_CERT_PASSWORD          .p12 password
#   IOS_PROFILE_BASE64         App Store provisioning profile (.mobileprovision) in base64
#   IOS_PROFILE_NAME           provisioning profile name
#   IOS_TEAM_ID                Apple Developer team ID
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64   App Store Connect API key
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Cache Kotlin/Native toolchain
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Install XcodeGen
      run: brew install xcodegen
    - name: Generate Xcode project
      run: cd iosApp && xcodegen generate

    - name: Install certificate and provisioning profile
      env:
        CERT_P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
        CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
      run: |
        KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
        KEYCHAIN_PASSWORD="$(uuidgen)"
        echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
        security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security list-keychain -d user -s "$KEYCHAIN" login.keychain
        mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
        echo "$PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/app.mobileprovision"

    - name: Archive
      env:
        TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
      run: |
        xcodebuild archive \
          -project iosApp/Voleizin.xcodeproj \
          -scheme Voleizin \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath "$RUNNER_TEMP/Voleizin.xcarchive" \
          CODE_SIGN_STYLE=Manual \
          DEVELOPMENT_TEAM="$TEAM_ID" \
          CODE_SIGN_IDENTITY="Apple Distribution" \
          PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
          CURRENT_PROJECT_VERSION="${{ github.run_number }}"

    - name: Export IPA
      env:
        TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
      run: |
        cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>provisioningProfiles</key>
          <dict><key>com.bismarck.voleimanager.app</key><string>$PROFILE_NAME</string></dict>
        </dict>
        </plist>
        EOF
        xcodebuild -exportArchive \
          -archivePath "$RUNNER_TEMP/Voleizin.xcarchive" \
          -exportPath "$RUNNER_TEMP/export" \
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

    - name: Upload to TestFlight
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
      run: |
        mkdir -p "$HOME/.appstoreconnect/private_keys"
        echo "$ASC_KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
        xcrun altool --upload-app --type ios \
          --file "$RUNNER_TEMP/export/Voleizin.ipa" \
          --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"